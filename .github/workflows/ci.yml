name: CI

on:
  push:
    branches:
      - master
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Both, and not just because the binary ships for both: the parts most
    # likely to break are the platform-specific ones (PTYs, passwd lookups,
    # runtime directories, the service manager), and they differ.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            name: linux
          - runner: macos-latest
            name: macos

    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      # rustup rather than an action, and the reason is the one thing an
      # action cannot be cached out of. Every third-party action is fetched
      # from codeload while the job is being set up, before the first step
      # runs, so six jobs is six fetches of the same tarball per push and the
      # release and nightly workflows add more. GitHub started answering 429,
      # and a job that never compiled anything failed on whichever runner lost
      # the race. Caching cannot reach it: the cache action is fetched the same
      # way, one step later.
      #
      # What is asked for is still the newest stable rather than whatever the
      # image happens to ship, because `Cargo.toml` names a `rust-version` and
      # an image a few weeks behind it would fail to build at all. That
      # download comes from the Rust project's own CDN, which is not the host
      # that ran out of patience, and it is skipped entirely when the image is
      # already current.
      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal -c clippy,rustfmt --no-self-update
          rustup default stable
          rustc --version && cargo clippy --version && cargo fmt --version

      # Debug artifacts, so a key of its own rather than sharing with the
      # release builds, which would thrash both. Only master saves; see below.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-${{ matrix.name }}"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # The integration tests spawn real PTYs and real child processes, and
      # stand a second machine up through a stub ssh, so they exercise the whole
      # path without needing an sshd on the runner.
      - name: Test
        run: cargo test --locked

      # The client core is what a mobile app links against, so it has to keep
      # building without anything that needs a PTY or a terminal.
      - name: Build the client core
        run: cargo check --lib --no-default-features --locked

  # A build for every target we ship, on every change, so a release is never
  # the first time a target is tried.
  cross:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-linux-android
            runner: ubuntu-22.04

    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      # As in the test job above, and for the same reason: an action fetched
      # per job is what ran into GitHub's rate limit, and this fetches nothing.
      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal -t ${{ matrix.target }} --no-self-update
          rustup default stable
          rustc --version

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Nothing in the tree compiles C, so the linker is all the NDK is needed
      # for. API 24 is the oldest Android that Termux itself still supports.
      - name: Point cargo at the Android NDK
        if: contains(matrix.target, 'android')
        run: |
          TOOLS="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLS/aarch64-linux-android24-clang" >> "$GITHUB_ENV"

      # The same key the nightly and release builds use: this job runs the
      # identical `cargo build --release --target X`, so a separate key would
      # mean two copies of one cache and neither ever warming the other.
      #
      # Only master saves. A pull request still restores, but its writes would
      # otherwise evict master's caches under the 10GB repository limit, which
      # with six targets is easy to hit.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-${{ matrix.target }}"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
