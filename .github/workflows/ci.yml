name: CI

on:
  push:
    branches:
      - master
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Both, and not just because the binary ships for both: the parts most
    # likely to break are the platform-specific ones (PTYs, passwd lookups,
    # runtime directories, the service manager), and they differ.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            name: linux
          - runner: macos-latest
            name: macos

    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-${{ matrix.name }}"
          cache-on-failure: true

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # The integration tests spawn real PTYs and real child processes, and
      # stand a second machine up through a stub ssh, so they exercise the whole
      # path without needing an sshd on the runner.
      - name: Test
        run: cargo test --locked

      # The client core is what a mobile app links against, so it has to keep
      # building without anything that needs a PTY or a terminal.
      - name: Build the client core
        run: cargo check --lib --no-default-features --locked

  # A build for every target we ship, on every change, so a release is never
  # the first time a target is tried.
  cross:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            runner: macos-latest

    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "cross-${{ matrix.target }}"
          cache-on-failure: true

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
