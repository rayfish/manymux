name: Nightly

# Rolling pre-release built from every push to master. Moves the `nightly` tag
# to the new commit, refreshes the `nightly` pre-release, and overwrites its
# Linux + macOS binaries. Until there is a stable release, this is what
# `install.sh` installs.
on:
  push:
    branches:
      - master
  workflow_dispatch:

# Avoid two master pushes racing to move the tag or clobber assets.
concurrency:
  group: nightly
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  roll-tag:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move the nightly tag to this commit
        id: meta
        run: |
          SHA=$(git rev-parse --short=8 HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git tag -f nightly
          git push -f origin nightly

      - name: Create / refresh the nightly pre-release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          name: nightly (${{ steps.meta.outputs.sha }})
          body: |
            Rolling build from master @ ${{ steps.meta.outputs.sha }}.

            ```
            curl -fsSL https://raw.githubusercontent.com/rayfish/manymux/master/install.sh | sh
            ```

            Run the same line on each machine you want to manage.
          prerelease: true

  build:
    needs: roll-tag
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            name: mm-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            name: mm-linux-aarch64
          # Static builds: one binary that runs on any Linux regardless of the
          # glibc version, which matters because mm gets copied onto whatever
          # boxes you happen to have.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
            name: mm-linux-x86_64-musl
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
            name: mm-linux-aarch64-musl
          - target: aarch64-apple-darwin
            runner: macos-latest
            name: mm-macos-aarch64
          - target: x86_64-apple-darwin
            # Cross-compiled on Apple Silicon (universal SDK); the Intel macOS
            # runners are being retired and leave the job queued indefinitely.
            runner: macos-latest
            name: mm-macos-x86_64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Per-target key: the two macOS targets share a runner, so a single
      # shared-key would make them overwrite each other's target dir cache.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-${{ matrix.target }}"
          cache-on-failure: true

      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package for release
        run: |
          BINARY=target/${{ matrix.target }}/release/mm
          cp "$BINARY" ${{ matrix.name }}
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.name }} > ${{ matrix.name }}.sha256
          else
            shasum -a 256 ${{ matrix.name }} > ${{ matrix.name }}.sha256
          fi

      - name: Upload nightly assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          files: |
            ${{ matrix.name }}
            ${{ matrix.name }}.sha256
