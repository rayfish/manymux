name: Install script

# The install one-liner is piped straight into a shell, so it gets the same gate
# as the rest of the code: a linter, and a real end-to-end run once there is a
# release to install.

on:
  push:
    branches:
      - master
    paths:
      - install.sh
      - .github/workflows/install.yml
  pull_request:
    paths:
      - install.sh
      - .github/workflows/install.yml

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # `local` is not POSIX but every shell that can be /bin/sh here implements
      # it, so lint against dash rather than the stricter `sh` dialect.
      - name: Shellcheck
        run: shellcheck -s dash install.sh

  # Actually install the latest release. The script's whole job is to put a
  # working `mm` on the host, so run it and then run what it installed.
  # Skipped until the first release exists, rather than failing every push.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Check for the asset this runner would actually download, not merely for
      # a release. The nightly release is created before its binaries finish
      # uploading, so "a release exists" is true during a window where there is
      # still nothing to install, and this job then fails for no real reason.
      - name: Is there something to install yet?
        id: released
        run: |
          case "$(uname -s)" in
            Linux) os=linux ;;
            Darwin) os=macos ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64) arch=x86_64 ;;
            aarch64|arm64) arch=aarch64 ;;
          esac
          asset="mm-${os}-${arch}"
          base="https://github.com/${{ github.repository }}/releases"
          if curl -fsIL "${base}/latest/download/${asset}" >/dev/null 2>&1 \
            || curl -fsIL "${base}/download/nightly/${asset}" >/dev/null 2>&1; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "no ${asset} published yet; skipping the install run"
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.released.outputs.yes == 'true'
        run: INSTALL_DIR="$HOME/.local/bin" sh install.sh

      - name: Run what was installed
        if: steps.released.outputs.yes == 'true'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mm --version
          mm ls local

      # An account with sudo installed and no right to use it, which is what a
      # deploy user reached over ssh with a key looks like, and what `mm` finds
      # when it offers to install itself on one. The default install dir is not
      # writable there, so this has to land in the account's own home instead of
      # spending three password prompts and then failing.
      - name: An account that cannot sudo
        if: steps.released.outputs.yes == 'true' && runner.os == 'Linux'
        run: |
          cp install.sh /tmp/install.sh
          chmod a+r /tmp/install.sh
          # A runner hands /usr/local/bin to the account it runs as, which no
          # real machine does and which would let this install straight into it.
          sudo chown root:root /usr/local/bin
          sudo chmod 755 /usr/local/bin
          sudo useradd -m nosudo
          sudo -H -u nosudo env MM_SKIP_LINGER=1 sh /tmp/install.sh
          sudo test -x /home/nosudo/.local/bin/mm
