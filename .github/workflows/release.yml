name: Release

# Pushing a tag like `v0.1.0` cuts a release with Linux, macOS and Android
# (Termux) binaries.
# Can also be run manually from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.extract_version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: extract_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git tag -a "${{ steps.extract_version.outputs.tag }}" -m "Release ${{ steps.extract_version.outputs.tag }}" 2>/dev/null || true
          git push origin "${{ steps.extract_version.outputs.tag }}" 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.extract_version.outputs.tag }}
          name: ${{ steps.extract_version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.extract_version.outputs.tag, '-') }}

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            name: mm-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            name: mm-linux-aarch64
          # Static builds: one binary that runs on any Linux regardless of the
          # glibc version, which matters because mm gets copied onto whatever
          # boxes you happen to have.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
            name: mm-linux-x86_64-musl
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
            name: mm-linux-aarch64-musl
          - target: aarch64-apple-darwin
            runner: macos-latest
            name: mm-macos-aarch64
          - target: x86_64-apple-darwin
            # Cross-compiled on Apple Silicon (universal SDK); the Intel macOS
            # runners are being retired and leave the job queued indefinitely.
            runner: macos-latest
            name: mm-macos-x86_64
          # Termux, on a phone. Linked against bionic, so neither Linux asset
          # runs here even though `uname` says Linux. Cross-compiled with the
          # NDK that ships on the runner image.
          - target: aarch64-linux-android
            runner: ubuntu-22.04
            name: mm-android-aarch64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      # rustup rather than an action, as in `ci.yml`, which explains why. It
      # matters most here: a release builds six targets at once, and a tag that
      # fails on a rate-limited download is one that has to be cut again.
      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none --no-modify-path
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal -t ${{ matrix.target }} --no-self-update
          rustup default stable
          rustc --version

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Nothing in the tree compiles C, so the linker is all the NDK is needed
      # for. API 24 is the oldest Android that Termux itself still supports.
      - name: Point cargo at the Android NDK
        if: contains(matrix.target, 'android')
        run: |
          TOOLS="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLS/aarch64-linux-android24-clang" >> "$GITHUB_ENV"

      # Per-target key: the two macOS targets share a runner, so a single
      # shared-key would make them overwrite each other's target dir cache.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release-${{ matrix.target }}"
          cache-on-failure: true

      # The commit goes into `mm --version`. A tagged release has a version
      # number that means something on its own, but the two are read together
      # often enough that leaving it out would be its own small mystery.
      - name: Build binary
        run: |
          export MM_COMMIT=$(git rev-parse --short=8 HEAD)
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Package for release
        run: |
          BINARY=target/${{ matrix.target }}/release/mm
          cp "$BINARY" ${{ matrix.name }}
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.name }} > ${{ matrix.name }}.sha256
          else
            shasum -a 256 ${{ matrix.name }} > ${{ matrix.name }}.sha256
          fi

      # The signature is over the checksum sidecar, not the binary: 65 bytes,
      # so there is no prehashing question to get wrong, and the sidecar is
      # what says which binary it covers. `src/signature.rs` checks the pair.
      #
      # Skipped rather than failed when no key is configured, so a fork can cut
      # its own releases. What that costs is caught at the other end: a client
      # with a key compiled in says out loud that a release is unsigned.
      #
      # To set one up, once:
      #
      #   openssl genpkey -algorithm ed25519 -out release.pem
      #   openssl pkey -in release.pem -pubout -outform DER | tail -c 32 | od -An -v -tx1 | tr -d ' \n'
      #
      # The first line is the secret, and goes in the RELEASE_SIGNING_KEY
      # repository secret whole, `-----BEGIN` line included. The second prints
      # the public half, which goes in `signature::RELEASE_KEY` and in
      # `RELEASE_KEY` in install.sh. Keep `release.pem` off this machine and out
      # of this repository.
      - name: Sign the checksum
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "no RELEASE_SIGNING_KEY secret; publishing this release unsigned"
            exit 0
          fi
          umask 077
          printf '%s' "$RELEASE_SIGNING_KEY" > signing-key.pem
          openssl pkeyutl -sign -inkey signing-key.pem -rawin \
            -in ${{ matrix.name }}.sha256 -out signature.bin
          # Hex rather than raw, so the sidecar beside it stays a text file and
          # a browser download cannot mangle it.
          od -An -v -tx1 signature.bin | tr -d ' \n' > ${{ matrix.name }}.sha256.sig
          rm -f signing-key.pem signature.bin
          test "$(wc -c < ${{ matrix.name }}.sha256.sig)" -eq 128

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: |
            ${{ matrix.name }}
            ${{ matrix.name }}.sha256
            ${{ matrix.name }}.sha256.sig

  # The phone app, which the matrix above does not build: its
  # `aarch64-linux-android` entry is the `mm` binary for Termux, a different
  # thing that happens to share a target triple. `assembleDebug` runs
  # `build-rust.sh` first, so the shim and its generated bindings come from
  # this same build.
  app:
    needs: create-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/rust
          shared-key: "release-android-app"
          cache-on-failure: true

      - name: Build the APK
        working-directory: android
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ./gradlew --no-daemon assembleDebug

      # Debug-signed, which is installable by anybody but is not an upgrade
      # path: the debug key is generated per machine, so a later release signed
      # by another key installs as a different app. Swap this for a signed
      # `assembleRelease` once there is a keystore to sign with.
      - name: Package the APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk manymux-android.apk
          sha256sum manymux-android.apk > manymux-android.apk.sha256

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: |
            manymux-android.apk
            manymux-android.apk.sha256
