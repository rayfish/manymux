[package]
name = "manymux"
version = "0.1.5"
edition = "2024"
rust-version = "1.91"
description = "Persistent terminal sessions on every machine you already ssh into"
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/rayfish/manymux"
keywords = ["terminal", "session", "multiplexer", "ssh", "tmux"]
categories = ["command-line-utilities"]

# The `mm` binary is desktop-only: it owns PTYs and drives a real terminal.
# A `--no-default-features` build is the library an Android/iOS client links
# against, so it must not pull in pty-process or crossterm.
[[bin]]
name = "mm"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
# Hosting sessions (pty-process) and attaching a real terminal to them
# (crossterm, clap). Off for mobile, which only ever plays the client half and
# renders the session with its own terminal widget.
desktop = [
    "dep:pty-process",
    "dep:crossterm",
    "dep:clap",
    "dep:clap_complete",
    "dep:tracing-subscriber",
    "dep:tracing-appender",
    "dep:ed25519-dalek",
]

[lints.clippy]
# Every mutex in the tree is a `std` one guarding a short synchronous critical
# section, which is only correct while none of them is held across an await.
# See src/lock.rs. Denied here rather than in CI so a local `cargo clippy` says
# so too.
await_holding_lock = "deny"
await_holding_invalid_type = "deny"

[dependencies]
anyhow = "1.0.104"
avt = "0.18.0"
bytes = "1.12.1"
# `unstable-ext` is what `#[arg(add = ...)]` goes through, and is how the
# completers in src/complete.rs get attached to the arguments they answer for.
clap = { version = "4.6.6", features = ["derive", "unstable-ext"], optional = true }
# `unstable-dynamic` moves completion from a generated script to the binary
# itself, which is the only way a tab can list sessions that exist right now.
clap_complete = { version = "4.6.9", features = ["unstable-dynamic"], optional = true }
crossterm = { version = "0.29.0", optional = true }
dirs = "6.0.0"
# Checking a release signature in this process, rather than shelling out the way
# the rest of `update` does. There is no tool to shell out to that is on enough
# machines to be worth having: minisign is on almost none, and macOS ships a
# LibreSSL whose `openssl` cannot verify a raw Ed25519 signature at all. A check
# that is usually skipped is not a check.
ed25519-dalek = { version = "3.0.0", default-features = false, optional = true }
libc = "0.2.189"
pty-process = { version = "0.5.3", features = ["async"], optional = true }
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = [
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-stream = { version = "0.1.19", default-features = false }
tokio-util = { version = "0.7.19", default-features = false, features = ["codec"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-appender = { version = "0.2.5", optional = true }
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
], optional = true }
unicode-width = "0.1.14"

[dev-dependencies]
# A terminal to run the binary on, for the prompts it only puts to a person.
pty-process = "0.5.3"
# `start_paused`, so a test can sit out the client-liveness deadline without
# spending three quarters of a minute of real time on it.
tokio = { version = "1.53.1", features = ["test-util"] }
