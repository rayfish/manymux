# The Xcode project, generated by XcodeGen (`just ios-project`) and not checked
# in: this file is the project, and the .xcodeproj is what Xcode wants to read.
name: Manymux
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Manymux.xcconfig
  Release: Manymux.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Manymux:
    type: application
    platform: iOS
    sources:
      - path: Manymux
      # Generated from the compiled shim by build-rust.sh, which runs first.
      - path: build/ManymuxCore.swift
        group: Generated
    dependencies:
      - framework: build/ManymuxCore.xcframework
        embed: false
      # What getrandom draws on for the device's key.
      - sdk: Security.framework
    preBuildScripts:
      - name: Rust core
        script: '"$SRCROOT/build-rust.sh" "$SRCROOT/build"'
        # Always run, and leave the deciding to cargo: what changed is in two
        # crates' worth of sources and Xcode knows about neither.
        basedOnDependencyAnalysis: false
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: manymux
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        # Asked the first time the app reaches a machine on the same network.
        NSLocalNetworkUsageDescription: manymux connects to your machines over SSH.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.manymux.phone
        TARGETED_DEVICE_FAMILY: "1,2"
        # The pre-build script writes into build/, outside what a sandboxed
        # script phase may touch.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  ManymuxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ManymuxTests
    dependencies:
      - target: Manymux
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.manymux.phone.tests
        GENERATE_INFOPLIST_FILE: YES
  ManymuxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ManymuxUITests
    dependencies:
      - target: Manymux
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.manymux.phone.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Manymux
schemes:
  Manymux:
    build:
      targets:
        Manymux: all
        ManymuxTests: [test]
        ManymuxUITests: [test]
    test:
      targets:
        - ManymuxTests
        - ManymuxUITests
